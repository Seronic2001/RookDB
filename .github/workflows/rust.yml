name: Rust

on:
  push:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:
    - uses: actions/checkout@v4
    - name: Checkout sibling crate rook-ast (path dependency)
      uses: actions/checkout@v4
      with:
        repository: RookDB/rook-ast
        ref: main
        path: rook-ast
    - name: Checkout sibling crate rook-parser (dev-dependency)
      uses: actions/checkout@v4
      with:
        repository: RookDB/rook-parser
        ref: main
        path: rook-parser
    - name: Link sibling crates for ../ path dependencies
      run: |
        ln -sfn "$GITHUB_WORKSPACE/rook-ast" "$GITHUB_WORKSPACE/../rook-ast"
        ln -sfn "$GITHUB_WORKSPACE/rook-parser" "$GITHUB_WORKSPACE/../rook-parser"
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Install toolchain components
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - name: Check formatting
      run: cargo fmt -p storage_manager -- --check

    - name: Run clippy
      run: cargo clippy -p storage_manager --all-targets -- -D warnings

    - name: Build
      run: cargo build --verbose
    
    - name: Run Tests
      run: cargo test --verbose

    - name: Generate Code Docs
      run: cargo doc --no-deps --verbose
